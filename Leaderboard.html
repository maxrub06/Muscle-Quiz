<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="app-icon.svg" type="image/svg+xml">
<title>Muscle Quest – Leaderboard</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
<main class="max-w-md mx-auto p-6">
  <h1 class="text-3xl font-extrabold text-amber-400 text-center mb-6">Leaderboard</h1>

  <section id="submit" class="hidden bg-slate-800 rounded-2xl p-6 text-center mb-6">
    <p class="text-slate-400">Your result</p>
    <p id="runInfo" class="text-xl font-extrabold my-2"></p>
    <input id="name" maxlength="20" placeholder="Your name" class="w-full rounded-xl bg-slate-900 border border-slate-600 px-4 py-3 my-3 text-center">
    <button id="save" class="w-full bg-amber-400 text-slate-900 font-bold rounded-xl py-4">Save to leaderboard</button>
  </section>

  <div id="tabs" class="flex gap-2 mb-4 text-sm"></div>
  <p id="note" class="text-xs text-amber-400 mb-2"></p>
  <h2 class="font-bold mb-3">Top scores</h2>
  <ol id="list" class="grid gap-2"></ol>

  <div class="grid gap-3 mt-8">
    <a href="Quiz1.html" class="block text-center bg-amber-400 text-slate-900 font-bold rounded-xl py-4">Play again</a>
    <a href="index.html" class="block text-center bg-slate-800 rounded-xl py-4">Home</a>
  </div>
</main>

<script>
const CONFIG = { API_URL: 'api/scores.php' };

const KEY = 'mq_board';
const ls = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch (e) { console.warn('Could not save leaderboard data locally:', e); return false; }
  }
};
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id' + Date.now() + Math.random().toString(36).slice(2);
let ME = ls.get('mq_player', null);
if (!ME) { ME = uid(); ls.set('mq_player', ME); }

/* ---------- Backend adapter (swap this to go online) ---------- */
const Backend = {
  async list(level) {
    if (CONFIG.API_URL) {
      const url = new URL(CONFIG.API_URL, location.href);
      if (level) url.searchParams.set('level', String(level));
      const response = await fetch(url);
      if (!response.ok) throw new Error(`Leaderboard request failed (${response.status}).`);
      const entries = await response.json();
      if (!Array.isArray(entries)) throw new Error('The leaderboard response is invalid.');
      return entries;
    }
    return ls.get(KEY, []);
  },
  async add(entry) {
    const all = ls.get(KEY, []);
    all.push(entry);
    const storedLocally = ls.set(KEY, all);
    if (CONFIG.API_URL) {
      try {
        const response = await fetch(new URL(CONFIG.API_URL, location.href), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(entry)
        });
        if (!response.ok) throw new Error(`Saving the score failed (${response.status}).`);
        return 'online';
      } catch (error) {
        if (storedLocally) return 'local';
        throw new Error('Could not save the score online or on this device.');
      }
    }
    if (!storedLocally) throw new Error('Could not save the score on this device.');
    return 'local';
  }
};

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let rows = [], filter = 0;

function draw() {
  $('tabs').innerHTML = [[0, 'All'], [1, 'Level 1'], [2, 'Level 2'], [3, 'Level 3']].map(([v, t]) =>
    `<button data-f="${v}" class="flex-1 rounded-xl py-3 ${filter === v ? 'bg-amber-400 text-slate-900 font-bold' : 'bg-slate-800'}">${t}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { filter = +b.dataset.f; draw(); });

  const list = rows.filter(r => !filter || r.level === filter)
    .sort((a, b) => b.pct - a.pct || b.total - a.total || a.ts - b.ts).slice(0, 50);
  $('list').innerHTML = list.length ? list.map((r, i) => `
    <li class="flex justify-between items-center gap-3 bg-slate-800 rounded-xl px-4 py-3 ${r.player === ME ? 'border border-amber-400' : ''}">
      <span class="flex items-center gap-3 min-w-0"><span class="w-7 text-center text-slate-400">${['🥇', '🥈', '🥉'][i] || i + 1}</span>
        <span class="min-w-0"><span class="block truncate">${esc(r.name)}</span>
        <span class="block text-xs text-slate-400">Level ${r.level} · ${r.score}/${r.total} · ${new Date(r.ts).toLocaleDateString()}</span></span></span>
      <span class="font-bold">${r.pct}%</span>
    </li>`).join('') : '<li class="text-center text-slate-400 py-8">No scores yet – play a quiz and save your result!</li>';
}

async function load() {
  try { rows = await Backend.list(filter); $('note').textContent = ''; }
  catch (e) { rows = ls.get(KEY, []); $('note').textContent = 'Offline – showing scores saved on this device.'; }
  draw();
}

/* ---------- Save a finished run (arrives from score.html as ?l=&s=&t=) ---------- */
const p = new URLSearchParams(location.search);
const level = +p.get('l'), score = +p.get('s'), total = +p.get('t');
let done = false; try { done = sessionStorage.getItem('mq_done') === location.search; } catch (e) {}
if (level >= 1 && level <= 3 && total > 0 && score >= 0 && score <= total && !done) {
  $('submit').classList.remove('hidden');
  $('name').value = ls.get('mq_name', '');
  $('runInfo').textContent = `Level ${level}: ${score}/${total} (${Math.round(score / total * 100)}%)`;
  $('save').onclick = async () => {
    const name = $('name').value.trim().slice(0, 20) || 'Anonymous';
    $('save').disabled = true;
    const entry = { id: uid(), player: ME, name, level, score, total, pct: Math.round(score / total * 100), ts: Date.now() };
    let saveNote = '';
    try {
      if (await Backend.add(entry) === 'local') saveNote = 'Online save failed – this score is saved on this device.';
    } catch (e) {
      $('note').textContent = e.message;
      $('save').disabled = false;
      return;
    }
    ls.set('mq_name', name);
    try { sessionStorage.setItem('mq_done', location.search); } catch (e) {}
    history.replaceState(null, '', location.pathname);
    $('submit').classList.add('hidden');
    await load();
    if (saveNote) $('note').textContent = saveNote;
  };
};
load();
</script>
<script>
(function () {
  const click = new Audio('click.wav');
  document.addEventListener('click', e => {
    const el = e.target.closest('a[href], button');
    if (!el || el.classList.contains('opt') || el.disabled) return;
    try { click.currentTime = 0; click.play().catch(() => {}); } catch (err) {}
    if (el.tagName === 'A' && !el.target && e.button === 0 && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
      e.preventDefault();
      setTimeout(() => { location.href = el.href; }, 150);
    }
  });
})();
</script>
</body>
</html>
