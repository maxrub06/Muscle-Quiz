<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muscle Quest – Results</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
<main class="max-w-md mx-auto p-6">
  <h1 class="text-3xl font-extrabold text-amber-400 text-center mb-6">Results</h1>
  <div id="res"></div>
  <h2 class="font-bold mt-8 mb-3">Best results</h2>
  <div id="best" class="grid gap-2"></div>
  <div class="grid gap-3 mt-8">
    <a id="again" href="index.html" class="block text-center bg-amber-400 text-slate-900 font-bold rounded-xl py-4">Play again</a>
    <a href="index.html" class="block text-center bg-slate-800 rounded-xl py-4">Home</a>
  </div>
</main>
<script>
const p = new URLSearchParams(location.search);
const l = +p.get('l'), s = +p.get('s'), t = +p.get('t');
if (l && t) {
  const pct = Math.round(s / t * 100);
  const msg = pct === 100 ? 'Perfect! 🏆' : pct >= 70 ? 'Great job! 💪' : pct >= 40 ? 'Good start – keep training!' : 'Time to review your anatomy 📚';
  document.getElementById('res').innerHTML = `<div class="bg-slate-800 rounded-2xl p-6 text-center"><p class="text-slate-400">Level ${l}</p><p class="text-6xl font-extrabold my-2">${s}/${t}</p><p class="text-2xl text-amber-400">${pct}%</p><p class="mt-3">${msg}</p></div>`;
  document.getElementById('again').href = `quiz${l}.html`;
} else document.getElementById('res').innerHTML = '<p class="text-center text-slate-400">No quiz played yet.</p>';
let d = {}; try { d = JSON.parse(localStorage.getItem('mq') || '{}'); } catch (e) {}
document.getElementById('best').innerHTML = [1, 2, 3].map(n => `<div class="flex justify-between bg-slate-800 rounded-xl px-4 py-3"><span>Level ${n}</span><span class="font-bold">${d[n] != null ? d[n] + '%' : '–'}</span></div>`).join('');
</script>
</body>
</html>
