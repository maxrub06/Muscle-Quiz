<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Muscle Quest</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body {
  background-image: radial-gradient(ellipse at 50% 0%, rgb(245 158 11 / 12%), transparent 48%);
}
.level-card {
  transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
}
.level-card:hover { transform: translateY(-2px); filter: brightness(1.06); }
.level-card:active { transform: scale(0.985); }
@media (prefers-reduced-motion: reduce) {
  .level-card { transition: none; }
  .level-card:hover, .level-card:active { transform: none; }
}
</style>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100">
<main class="mx-auto flex min-h-screen max-w-xl flex-col justify-start px-5 pt-6 pb-8 sm:justify-center sm:px-8 sm:py-10">
  <header class="mb-6 text-center">
    <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center overflow-hidden rounded-2xl border border-amber-400/20 bg-white shadow-lg shadow-amber-950/20">
      <img src="rhode.jpg" alt="Seal of the State of Rhode Island" class="h-full w-full object-cover">
    </div>
    <p class="mb-2 text-xs font-bold uppercase tracking-[0.25em] text-amber-400">Train your anatomy</p>
    <h1 class="text-4xl font-extrabold tracking-tight text-slate-100 sm:text-5xl">Muscle <span class="text-amber-400">Quest</span></h1>
  </header>

  <section aria-labelledby="levels-heading">
    <div class="mb-3 flex items-center justify-between px-1">
      <h2 id="levels-heading" class="text-sm font-bold uppercase tracking-wider text-slate-400">Choose your level</h2>
      <span class="text-xs text-slate-500">3 challenges</span>
    </div>
    <nav class="grid gap-3" aria-label="Quiz levels">
      <a href="quiz1.html" class="level-card group flex items-center gap-4 rounded-2xl bg-emerald-600 p-4 text-white shadow-lg shadow-emerald-950/30 hover:shadow-xl hover:shadow-emerald-950/40 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-300 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-900 sm:p-5">
        <span class="rounded-full bg-white px-3 py-2 text-xs font-extrabold tracking-wide text-emerald-800 transition-transform group-hover:translate-x-1">PLAY <span aria-hidden="true">→</span></span>
        <span class="min-w-0 flex-1">
          <span class="block text-lg font-bold">Beginner</span>
          <span class="mt-0.5 block text-sm text-white/80">10 questions <span aria-hidden="true">·</span> Level 1</span>
        </span>
      </a>
      <a href="quiz2.html" class="level-card group flex items-center gap-4 rounded-2xl bg-amber-400 p-4 text-slate-950 shadow-lg shadow-amber-950/30 hover:shadow-xl hover:shadow-amber-950/40 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-200 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-900 sm:p-5">
        <span class="rounded-full bg-white px-3 py-2 text-xs font-extrabold tracking-wide text-amber-800 transition-transform group-hover:translate-x-1">PLAY <span aria-hidden="true">→</span></span>
        <span class="min-w-0 flex-1">
          <span class="block text-lg font-bold">Intermediate</span>
          <span class="mt-0.5 block text-sm text-slate-900/75">30 questions <span aria-hidden="true">·</span> Level 2</span>
        </span>
      </a>
      <a href="quiz3.html" class="level-card group flex items-center gap-4 rounded-2xl bg-rose-600 p-4 text-white shadow-lg shadow-rose-950/30 hover:shadow-xl hover:shadow-rose-950/40 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-rose-300 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-900 sm:p-5">
        <span class="rounded-full bg-white px-3 py-2 text-xs font-extrabold tracking-wide text-rose-800 transition-transform group-hover:translate-x-1">PLAY <span aria-hidden="true">→</span></span>
        <span class="min-w-0 flex-1">
          <span class="block text-lg font-bold">Expert</span>
          <span class="mt-0.5 block text-sm text-white/80">All muscles <span aria-hidden="true">·</span> Level 3</span>
        </span>
      </a>
    </nav>
  </section>

  <nav class="mt-6 grid grid-cols-2 gap-3" aria-label="More options">
    <a href="score.html" class="rounded-xl border border-slate-700 bg-slate-800/70 px-4 py-4 text-center transition hover:border-amber-400/50 hover:bg-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-400">
      <span class="mb-1 block text-lg" aria-hidden="true">🏆</span>
      <span class="block text-sm font-bold">My results</span>
      <span class="mt-1 block text-xs text-slate-400">Personal bests</span>
    </a>
    <a href="leaderboard.html" class="rounded-xl border border-slate-700 bg-slate-800/70 px-4 py-4 text-center transition hover:border-amber-400/50 hover:bg-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-400">
      <span class="mb-1 block text-lg" aria-hidden="true">📋</span>
      <span class="block text-sm font-bold">Leaderboard</span>
      <span class="mt-1 block text-xs text-slate-400">School scores</span>
    </a>
  </nav>
</main>
<script>
(function () {
  const click = new Audio('click.wav');
  document.addEventListener('click', e => {
    const el = e.target.closest('a[href], button');
    if (!el || el.classList.contains('opt') || el.disabled) return;
    try { click.currentTime = 0; click.play().catch(() => {}); } catch (err) {}
    if (el.tagName === 'A' && !el.target && e.button === 0 && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
      e.preventDefault();
      setTimeout(() => { location.href = el.href; }, 150);
    }
  });
})();
</script>
</body>
</html>
