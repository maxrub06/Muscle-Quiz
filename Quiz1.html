<script>

const W = {
  'Deltoideus': 'Deltoid muscle', 'Diaphragma': 'Thoracic diaphragm', 'Frontalis': 'Occipitofrontalis muscle',
  'Intercostales externi': 'External intercostal muscles', 'Temporalis': 'Temporal muscle',
  'Obliquus externus abdominis': 'External oblique muscle', 'Rhomboideus major': 'Rhomboid major muscle',
  'Sternocleidomastoideus': 'Sternocleidomastoid muscle', 'Latissimus dorsi': 'Latissimus dorsi muscle',

  'Rectus abdominis': 'Rectus abdominis muscle', 'Gastrocnemius': 'Gastrocnemius muscle'
};
function loadPic(q) {
  const t = (W[q.n] || q.n).replace(/ /g, '_');
  const box = document.getElementById('pic');
  const link = `https://en.wikipedia.org/wiki/${encodeURIComponent(t)}`;
  const show = (src, alt) => {
    box.innerHTML = `<a href="${src}" target="_blank" rel="noopener"><img src="${src}" alt="${alt}" class="w-full max-h-72 object-contain bg-white rounded-xl"></a>
      <a href="${link}" target="_blank" rel="noopener" class="block text-sm text-amber-400 underline mt-2">${q.n} on Wikipedia</a>`;
  };
  const fallback = () => show(IMG[q.v], 'Muscle chart');
  const api = `https://en.wikipedia.org/w/api.php?action=query&format=json&prop=pageimages&piprop=thumbnail&pithumbsize=500&redirects=1&origin=*&titles=${encodeURIComponent(t)}`;
  fetch(api).then(r => r.json()).then(d => {
    const p = Object.values(d.query.pages)[0];
    const src = p && p.thumbnail && p.thumbnail.source;
    src && !/\.svg/i.test(src) ? show(src, q.n) : fallback();
  }).catch(fallback);
}
const SND = { correct: new Audio('correct.wav'), fail: new Audio('fail.wav') };
const play = k => { try { SND[k].currentTime = 0; SND[k].play().catch(() => {}); } catch (e) {} };
const COUNT = { 1: 10, 2: 30, 3: Infinity };
const sh = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(x => x[1]);

const loadMuscles = () => fetch('muscles.json').then(r => { if (!r.ok) throw 0; return r.json(); })
    .catch(() => new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'muscles.js'; s.onload = () => res(window.MUSCLES); s.onerror = rej; document.head.appendChild(s); }))
    .catch(() => JSON.parse(document.getElementById('muscle-data').textContent));
loadMuscles().then(function (M) {
  const level = 1;
  const pool = M;
  const qs = sh(pool).slice(0, COUNT[level]);
  const app = document.getElementById('app');
  let i = 0, s = 0;

  const distractors = q => {
    const others = pool.filter(x => x !== q);
    return sh(others.filter(x => x.r === q.r)).concat(sh(others.filter(x => x.r !== q.r))).slice(0, 3);
  };

  function render() {
    const q = qs[i];
    const opts = sh([q, ...distractors(q)]);
    app.innerHTML = `
      <div class="flex justify-between text-sm text-slate-400 mb-2"><span>Question ${i + 1}/${qs.length}</span><span>Score ${s}</span></div>
      <div class="h-2 bg-slate-700 rounded-full mb-6"><div class="h-2 bg-amber-400 rounded-full transition-all" style="width:${(i / qs.length) * 100}%"></div></div>
      <p class="text-xl font-semibold mb-6">Which muscle ${q.f}?</p>
      <div class="grid gap-3">${opts.map(o => `<button data-n="${o.n}" class="opt w-full text-left bg-slate-800 border border-slate-600 rounded-xl px-4 py-4 active:scale-95 transition">${o.n}</button>`).join('')}</div>
      <div id="fb" class="mt-6"></div>`;
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b, q));
  }

  function answer(btn, q) {
    const ok = btn.dataset.n === q.n;
    if (ok) s++;
    play(ok ? 'correct' : 'fail');
    app.querySelectorAll('.opt').forEach(b => {
      b.disabled = true;
      if (b.dataset.n === q.n) b.className = 'opt w-full text-left bg-emerald-600 border border-emerald-400 rounded-xl px-4 py-4';
      else if (b === btn) b.className = 'opt w-full text-left bg-rose-700 border border-rose-400 rounded-xl px-4 py-4';
    });
    const last = i === qs.length - 1;
    document.getElementById('fb').innerHTML = `
      <p class="mb-3 font-semibold ${ok ? 'text-emerald-400' : 'text-rose-400'}">${ok ? 'Correct!' : 'Wrong – correct answer: ' + q.n}</p>
      <p class="text-sm text-slate-400 mb-2">${q.n} · ${q.r} · ${q.v === 'f' ? 'front' : 'back'}</p>
      <div id="pic" class="mb-4"><p class="text-sm text-slate-400">Loading picture…</p></div>
      <button id="next" class="w-full bg-amber-400 text-slate-900 font-bold rounded-xl py-4">${last ? 'See results' : 'Next question'}</button>`;
    loadPic(q);
    document.getElementById('next').onclick = () => last ? finish() : (i++, render());
  }

  function finish() {
    try {
      const d = JSON.parse(localStorage.getItem('mq') || '{}');
      d[level] = Math.max(d[level] || 0, Math.round((s / qs.length) * 100));
      localStorage.setItem('mq', JSON.stringify(d));
    } catch (e) {}
    location.href = `score.html?l=${level}&s=${s}&t=${qs.length}`;
  }

  render();
}).catch(() => { document.getElementById('app').innerHTML = '<p class="text-rose-400">Could not load the muscle data (muscles.json / muscles.js).</p>'; });
</script>
<script>
(function () {
  const click = new Audio('click.wav');
  document.addEventListener('click', e => {
    const el = e.target.closest('a[href], button');
    if (!el || el.classList.contains('opt') || el.disabled) return;
    try { click.currentTime = 0; click.play().catch(() => {}); } catch (err) {}
    if (el.tagName === 'A' && !el.target && e.button === 0 && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
      e.preventDefault();
      setTimeout(() => { location.href = el.href; }, 150);
    }
  });
})();
</script>
